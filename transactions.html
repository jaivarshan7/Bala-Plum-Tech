<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Commercial Plumbing Inventory Stock Transactions and Audit History" />
    <title>Bala Plumb Tech | Transactions</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/inventory.css" />
    <link rel="stylesheet" href="./css/forms.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script type="module" src="./js/pages/transactions.js"></script>
  </head>
  <body>
    <div id="appShell" class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="main-panel">
        <header id="topbar" class="topbar"></header>
        <main class="page-content">
          <div class="page-header">
            <div>
              <p class="eyebrow">History</p>
              <h1>Inventory Transactions</h1>
            </div>
          </div>

          <section class="toolbar panel">
            <div class="search-wrap">
              <input id="transactionSearch" type="search" placeholder="Search transactions..." />
            </div>
            <div class="toolbar-filters">
              <select id="transactionTypeFilter">
                <option value="">All Types</option>
                <option value="STOCK_IN">Stock In</option>
                <option value="STOCK_OUT">Stock Out</option>
                <option value="ADJUSTMENT">Adjustment</option>
              </select>
              <input id="transactionDateFilter" type="date" />
            </div>
          </section>

          <section class="panel">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Item</th>
                    <th>Type</th>
                    <th>Qty</th>
                    <th>Prev</th>
                    <th>New</th>
                    <th>Employee</th>
                    <th>Reason</th>
                  </tr>
                </thead>
                <tbody id="transactionTableBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script type="module" src="./js/components/sidebar.js"></script>
    <script type="module" src="./js/components/navbar.js"></script>
  </body>
</html>
