<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Commercial Plumbing Inventory Management - Catalog, Stock Levels, and Categories" />
    <title>Bala Plumb Tech | Inventory</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/inventory.css" />
    <link rel="stylesheet" href="./css/forms.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.default.min.css" />
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
    <script type="module" src="./js/pages/inventory.js"></script>
  </head>
  <body>
    <div id="appShell" class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="main-panel">
        <header id="topbar" class="topbar"></header>
        <main class="page-content">
          <div class="page-header with-actions">
            <div>
              <p class="eyebrow">Inventory</p>
              <h1>Inventory Management</h1>
            </div>
            <button id="addItemButton" class="btn btn-primary">+ Add Item</button>
          </div>

          <section class="toolbar panel">
            <div class="search-wrap">
              <input id="inventorySearch" type="search" placeholder="Search product, SKU, brand, category, size, notes..." />
            </div>
            <div class="toolbar-filters">
              <select id="categoryFilter">
                <option value="">All Categories</option>
              </select>
              <select id="subcategoryFilter">
                <option value="">All Subcategories</option>
              </select>
              <select id="brandFilter">
                <option value="">All Brands</option>
              </select>
              <select id="stockFilter">
                <option value="">All Stock</option>
                <option value="low">Low Stock</option>
                <option value="in">In Stock</option>
                <option value="out">Out of Stock</option>
              </select>
            </div>
          </section>

          <section class="panel">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Subcategory</th>
                    <th>Brand</th>
                    <th>Size</th>
                    <th>Stock</th>
                    <th>Unit</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="inventoryTableBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="itemModal" class="modal hidden" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="itemModalTitle">Add Inventory Item</h2>
          <button class="close-button" data-close-modal="itemModal">×</button>
        </div>
        <form id="inventoryForm" class="stack-form">
          <div class="modal-form-body">
            <div class="form-grid two-col">
            <div class="form-group"><label>Product Name</label><input name="name" required /></div>
            <div class="form-group"><label>SKU <span class="small-muted">(optional)</span></label><input name="sku" /></div>
            <div class="form-group"><label>Category</label><select name="category"></select></div>
            <div class="form-group subcategory-field"><label for="subcategoryField">Subcategory</label><select id="subcategoryField" name="subcategory" required><option value="">Select category first</option></select></div>
            <div class="form-group"><label>Unit</label><select name="unit" required></select></div>
            <div class="form-group"><label>Brand</label><select name="brand"></select></div>
            <div class="form-group"><label>Size</label><input name="size" placeholder="e.g. 1/2 inch" /></div>
            <div class="form-group"><label>Current Stock</label><input name="stock" type="number" min="0" required /></div>
            <div class="form-group"><label>Minimum Stock</label><input name="minimumStock" type="number" min="0" required /></div>
            <div class="form-group"><label>Unit Cost</label><input name="unitCost" type="number" min="0" step="0.01" /></div>
            <div class="form-group"><label>Storage Location <span class="small-muted">(optional)</span></label><input name="storageLocation" /></div>
            </div>
            <div class="form-group"><label>Description</label><textarea name="description"></textarea></div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" data-close-modal="itemModal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Item</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="./js/components/sidebar.js"></script>
    <script type="module" src="./js/components/navbar.js"></script>
  </body>
</html>
